<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Last Working Day Calculator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 2rem;
      background-color: #f4f4f4;
    }
    .container {
      background: white;
      padding: 2rem;
      max-width: 400px;
      margin: auto;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    input, button {
      width: 100%;
      padding: 0.6rem;
      margin-top: 1rem;
      font-size: 1rem;
    }
    .result {
      margin-top: 1.5rem;
      font-weight: bold;
      color: #333;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Last Working Day Calculator</h2>
    <label for="resignDate">Resignation Date:</label>
    <input type="date" id="resignDate" />

    <label for="noticeDays">Notice Period (in days):</label>
    <input type="number" id="noticeDays" min="0" value="30" />

    <button onclick="calculateLastDay()">Calculate</button>

    <div class="result" id="output"></div>
  </div>

  <script>
    function calculateLastDay() {
      const resignDateInput = document.getElementById('resignDate').value;
      const noticeDays = parseInt(document.getElementById('noticeDays').value, 10);

      if (!resignDateInput || isNaN(noticeDays)) {
        document.getElementById('output').textContent = 'Please enter both the resignation date and notice period.';
        return;
      }

      const resignDate = new Date(resignDateInput);
      resignDate.setDate(resignDate.getDate() + noticeDays);

      const options = { year: 'numeric', month: 'long', day: 'numeric' };
      const formattedDate = resignDate.toLocaleDateString(undefined, options);

      document.getElementById('output').textContent = `Your last working day is: ${formattedDate}`;
    }
  </script>
</body>
</html>
